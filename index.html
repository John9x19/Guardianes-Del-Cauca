<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guardianes del Cauca · Juego educativo</title>
<style>
  :root{
    --river-deep:#075b68;
    --river-mid:#188b88;
    --river-light:#d7f2e7;
    --leaf-green:#47845c;
    --bank-brown:#765033;
    --sun-gold:#e7b94f;
    --danger-coral:#c84f3b;
    --cream:#fbf1d9;
    --ink:#243d37;
    --white:#ffffff;
    --paper-edge:#cdb88d;
    --river-shadow:rgba(6,37,46,.24);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
  body{
    min-height:100vh;min-height:100dvh;height:100vh;height:100dvh;
    display:flex;flex-direction:column;align-items:stretch;
    color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;
    background:radial-gradient(ellipse at 50% 0%,#2e9384 0%,#0b5966 62%,#073d4b 100%);
  }
  button{font:inherit}
  .app-header{
    position:relative;z-index:2;flex:0 0 auto;width:100%;
    min-height:72px;padding:.55rem 4.5rem .45rem;
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:#fff;
    background:linear-gradient(135deg,rgba(5,68,77,.96),rgba(20,130,126,.92));
    box-shadow:0 4px 14px rgba(0,35,40,.18);
  }
  .header-inner h1{
    margin:0 0 .12rem;font-family:"Trebuchet MS","Segoe UI",sans-serif;
    font-size:clamp(1.28rem,2.7vw,1.9rem);line-height:1.12;letter-spacing:.015em;
  }
  .header-inner .subtitle{margin:0;color:#d7f2e7;font-size:clamp(.72rem,1.35vw,.95rem)}
  .wave-divider{position:absolute;bottom:-1px;left:0;display:block;width:100%;height:9px;opacity:.9}
  .lang-btn{
    position:absolute;top:50%;right:clamp(.45rem,2vw,1.2rem);transform:translateY(-50%);
    border:1px solid rgba(255,255,255,.7);border-radius:999px;
    background:rgba(255,255,255,.15);color:#fff;padding:.38rem .82rem;
    font-size:.78rem;font-weight:800;cursor:pointer;white-space:nowrap;
  }
  .lang-btn:hover{background:rgba(255,255,255,.28)}
  .lang-btn:focus-visible{outline:3px solid var(--sun-gold);outline-offset:2px}

  main{
    flex:1 1 auto;min-height:0;width:100%;max-width:1120px;margin:0 auto;
    padding:.5rem clamp(.5rem,1.8vw,1.1rem) .45rem;
    display:flex;flex-direction:column;gap:.5rem;
  }
  .hud{
    flex:0 0 auto;display:grid;
    grid-template-columns:minmax(58px,.55fr) minmax(150px,1.25fr) minmax(190px,1.65fr);
    gap:.8rem;align-items:center;
    margin:0;padding:.48rem .85rem;min-height:58px;
    border:1px solid rgba(205,184,141,.9);border-radius:14px;
    background:
      repeating-linear-gradient(0deg,rgba(107,66,38,.035) 0,rgba(107,66,38,.035) 1px,transparent 1px,transparent 5px),
      radial-gradient(circle at 100% 0,rgba(231,185,79,.15),transparent 34%),var(--cream);
    box-shadow:0 5px 14px rgba(6,37,46,.18);
  }
  .hud-label{display:block;font-size:.7rem;color:#59675d;line-height:1.15}
  .hud-value{font-size:1.15rem;line-height:1.1;font-weight:900;color:var(--river-deep);font-variant-numeric:tabular-nums}
  .hud-score{display:flex;flex-direction:column;justify-content:center;min-width:0}
  .hud-level{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:.14rem}
  .hud-goal{font-size:.74rem;line-height:1.18;color:var(--river-deep);font-weight:800;min-height:1em;overflow-wrap:anywhere}
  .hud-health{min-width:0;width:100%}
  .hud-health-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.22rem}
  .health-track{width:100%;height:12px;border-radius:999px;background:#dbe5d8;border:1px solid rgba(37,91,73,.18);overflow:hidden}
  .health-fill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#4b9a68,#77b96d);transition:width .25s ease,background .25s ease}

  .stage-area{flex:1 1 auto;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .canvas-wrap{
    position:relative;flex:0 0 auto;width:100%;height:100%;
    border:3px solid rgba(250,244,222,.88);border-radius:18px;overflow:hidden;
    box-shadow:0 12px 28px rgba(6,37,46,.3),inset 0 0 0 1px rgba(255,255,255,.24);
    touch-action:none;background:#acd9c7;
  }
  canvas{display:block;width:100%;height:100%;background:#acd9c7;touch-action:none}
  canvas:focus-visible{outline:4px solid var(--sun-gold);outline-offset:-4px}
  .toast-banner{
    position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;
    max-width:calc(100% - 24px);background:rgba(8,62,65,.91);color:#fff;
    padding:.42rem .85rem;border:1px solid rgba(255,255,255,.28);border-radius:999px;
    font-size:.82rem;font-weight:800;text-align:center;pointer-events:none;
    opacity:0;transition:opacity .2s ease;white-space:normal;
  }
  .toast-banner.show{opacity:1}
  .overlay{
    position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    padding:clamp(.4rem,2vw,1rem);background:rgba(6,37,38,.38);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  .overlay-card{
    position:relative;width:min(560px,100%);max-height:calc(100% - 8px);overflow-y:auto;
    padding:clamp(.85rem,2.2vw,1.35rem) clamp(.9rem,2.5vw,1.55rem);
    text-align:left;border:1px solid var(--paper-edge);border-top:6px solid var(--bank-brown);
    border-radius:18px;color:var(--ink);
    background:
      radial-gradient(circle at 100% 0,rgba(231,185,79,.16),transparent 31%),
      repeating-linear-gradient(0deg,rgba(107,66,38,.035) 0,rgba(107,66,38,.035) 1px,transparent 1px,transparent 5px),var(--cream);
    box-shadow:0 16px 38px rgba(0,0,0,.25);
  }
  .card-kicker{margin:0 0 .35rem!important;color:#7a6a4d;font-size:.64rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
  .overlay-card h2{
    position:relative;margin:0 0 .6rem;padding-bottom:.5rem;
    font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--river-deep);
    font-size:clamp(1.12rem,2.8vw,1.4rem);line-height:1.2;
  }
  .overlay-card h2::after{content:"";position:absolute;left:0;bottom:0;width:52px;height:3px;border-radius:8px;background:linear-gradient(90deg,var(--leaf-green),var(--sun-gold))}
  .overlay-card p{margin:0 0 .6rem;line-height:1.42;font-size:clamp(.83rem,1.45vw,.96rem)}
  .overlay-card .rules{margin:.25rem 0 .55rem;padding-left:1.2rem}
  .overlay-card .rules li{margin-bottom:.28rem;font-size:clamp(.8rem,1.35vw,.92rem);line-height:1.35}
  .controls-hint{color:#38534a;font-weight:650}
  .evidence-source{margin-top:.65rem!important;padding-top:.55rem;border-top:1px dashed rgba(107,66,38,.35);font-size:.74rem!important;line-height:1.35!important;color:#59635b}
  .action-block{margin:.55rem 0 .7rem;padding:.65rem .8rem;border:1px solid rgba(60,140,91,.25);border-left:5px solid var(--leaf-green);border-radius:10px;background:rgba(237,245,233,.92)}
  .action-block h3{margin:0 0 .25rem;color:var(--leaf-green);font-size:.9rem}
  .action-block p{margin:0}
  .comprehension-block{margin:0 0 .7rem!important;font-size:.82rem!important;color:#39493f}
  [hidden]{display:none!important}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
    border:1px solid rgba(11,95,122,.2);border-radius:999px;padding:.62rem 1.22rem;
    font-size:.92rem;font-weight:850;cursor:pointer;box-shadow:0 3px 0 rgba(6,37,46,.15);
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(6,37,46,.15)}
  .btn-primary{background:var(--river-deep);color:#fff}
  .btn-primary:hover{background:var(--river-mid)}
  .btn:focus-visible{outline:3px solid var(--sun-gold);outline-offset:2px}

  .touch-controls{
    flex:0 0 auto;min-height:56px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;gap:.65rem;padding:.15rem .3rem .2rem;
  }
  .move-pad{display:flex;align-items:center;gap:.38rem}
  .ctrl-btn{
    width:44px;height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.38);border-radius:13px;
    background:linear-gradient(180deg,#0c6b76,#074e60);color:#fff;
    font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:0 3px 0 rgba(2,34,42,.24);
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  .ctrl-btn:active{background:#188b88;transform:translateY(1px)}
  .ctrl-btn:focus-visible{outline:3px solid var(--sun-gold);outline-offset:2px}
  .discard-btn{width:auto;min-width:74px;padding:0 .48rem;gap:.25rem;flex-direction:column;background:linear-gradient(180deg,#d76a51,#ad3c31);font-size:1.05rem}
  .discard-btn small{font-size:.58rem;line-height:1;font-weight:900;letter-spacing:.04em}
  .control-readout{min-width:0;text-align:center;color:#f5f3d9;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .control-readout strong{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:#ffe5a2}
  .control-readout p{margin:.08rem 0 0;font-size:.73rem;line-height:1.2;font-weight:700}
  .app-footer{display:none}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .hud,.canvas-wrap,.touch-controls,.ctrl-btn,.btn{user-select:none;-webkit-user-select:none}

  @media(max-width:620px){
    .app-header{min-height:62px;padding:.45rem 4rem .42rem}
    .header-inner h1{font-size:1.28rem}
    .header-inner .subtitle{font-size:.7rem}
    .lang-btn{right:.4rem;padding:.32rem .58rem;font-size:.68rem}
    main{padding:.38rem .4rem .35rem;gap:.38rem}
    .hud{grid-template-columns:48px minmax(92px,1fr) minmax(108px,1.2fr);gap:.42rem;padding:.38rem .52rem;min-height:52px;border-radius:11px}
    .hud-label{font-size:.59rem}
    .hud-value{font-size:.98rem}
    .hud-goal{font-size:.61rem}
    .health-track{height:9px}
    .touch-controls{min-height:52px;gap:.4rem;padding:0}
    .ctrl-btn{width:42px;height:42px;min-width:42px;border-radius:12px}
    .discard-btn{width:64px;min-width:64px}
    .control-readout strong{font-size:.61rem}
    .control-readout p{font-size:.65rem}
    .overlay-card{border-top-width:5px;border-radius:14px}
  }
  @media(max-width:360px){
    .hud{grid-template-columns:42px minmax(86px,1fr) minmax(94px,1.1fr);gap:.32rem;padding:.35rem .4rem}
    .hud-goal{font-size:.56rem}
    .control-readout p{font-size:.59rem}
    .ctrl-btn{width:38px;height:40px;min-width:38px}
    .discard-btn{width:58px;min-width:58px}
  }
  @media(max-height:650px){
    .app-header{min-height:56px;padding:.28rem 4rem .3rem}
    .header-inner h1{font-size:1.18rem}
    .header-inner .subtitle{font-size:.65rem}
    main{padding-top:.28rem;padding-bottom:.25rem;gap:.32rem}
    .hud{min-height:48px;padding:.3rem .65rem}
    .touch-controls{min-height:46px}
    .ctrl-btn{height:38px;width:40px;min-width:40px}
    .discard-btn{width:65px;min-width:65px}
    .overlay-card{padding:.7rem .9rem;max-height:calc(100% - 6px)}
    .overlay-card h2{margin-bottom:.42rem;font-size:1.12rem}
    .overlay-card p{margin-bottom:.38rem;line-height:1.3;font-size:.8rem}
    .overlay-card .rules li{font-size:.76rem;margin-bottom:.18rem}
    .evidence-source{margin-top:.35rem!important;padding-top:.35rem;font-size:.68rem!important}
    .btn{padding:.48rem 1rem;font-size:.82rem}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  .move-pad{grid-column:1}.control-readout{grid-column:2}
  .tf-pad{grid-column:1/-1;justify-self:center;display:flex;gap:1.4rem}
  .tf-btn{width:96px;height:52px;border:2px solid rgba(255,255,255,.8);border-radius:14px;color:#fff;font-size:1.8rem;font-weight:900;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 rgba(0,0,0,.28)}
  .tf-false{background:linear-gradient(180deg,#e0533d,#b02e22)}
  .tf-true{background:linear-gradient(180deg,#3fae62,#217a41)}
  .tf-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
  .tf-btn:focus-visible{outline:3px solid var(--sun-gold);outline-offset:2px}
  #comprehensionText{white-space:pre-line}
  @media(max-width:620px){.tf-btn{width:84px;height:46px;font-size:1.6rem}}
</style>
</head>
<body>

<header class="app-header">
  <button id="langToggle" class="lang-btn" type="button" aria-label="Change language / Cambiar idioma"></button>
  <div class="header-inner">
    <h1>Guardianes del Cauca</h1>
    <p class="subtitle" data-i18n="app_subtitle"></p>
  </div>
  <svg class="wave-divider" viewBox="0 0 800 28" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,14 Q100,28 200,14 T400,14 T600,14 T800,14 L800,28 L0,28 Z" fill="var(--cream)"></path>
  </svg>
</header>

<main>
  <section class="hud" aria-label="Estado del juego">
    <div class="hud-score">
      <span class="hud-label" data-i18n="hud_score"></span>
      <span id="scoreValue" class="hud-value">0</span>
    </div>
    <div class="hud-level">
      <span class="hud-label" id="hudLevelLine"></span>
      <span class="hud-goal" id="hudGoalLabel"></span>
    </div>
    <div class="hud-health">
      <div class="hud-health-top">
        <span class="hud-label" data-i18n="hud_health"></span>
        <span id="healthPercent" class="hud-value">100%</span>
      </div>
      <div class="health-track" id="healthBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <div id="healthFill" class="health-fill"></div>
      </div>
    </div>
  </section>

  <div class="stage-area" id="stageArea">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas" width="800" height="600" tabindex="0"></canvas>
    <div id="toastBanner" class="toast-banner" aria-hidden="true"></div>

    <div id="startScreen" class="overlay" role="dialog" aria-modal="true">
      <div class="overlay-card">
        <p class="card-kicker" data-i18n="card_kicker"></p>
        <h2 data-i18n="start_title"></h2>
        <p data-i18n="start_body"></p>
        <ul class="rules">
          <li data-i18n="start_rule1"></li>
          <li data-i18n="start_rule2"></li>
        </ul>
        <p class="controls-hint" data-i18n="start_controls"></p>
        <button id="startBtn" class="btn btn-primary" type="button" data-i18n="start_btn"></button>
      </div>
    </div>

    <div id="evidenceModal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="evidenceTitle" aria-describedby="evidenceBody" hidden>
      <div class="overlay-card">
        <p class="card-kicker" data-i18n="card_kicker"></p>
        <h2 id="evidenceTitle"></h2>
        <p id="evidenceBody"></p>
        <p class="evidence-source" id="evidenceSource"></p>
        <button id="evidenceContinueBtn" class="btn btn-primary" type="button"></button>
      </div>
    </div>

    <div id="levelCloseScreen" class="overlay" role="dialog" aria-modal="true" aria-labelledby="closeTitle" aria-describedby="closeBody" hidden>
      <div class="overlay-card">
        <p class="card-kicker" data-i18n="card_kicker"></p>
        <h2 id="closeTitle"></h2>
        <p id="closeBody"></p>
        <p class="evidence-source" id="closeSource"></p>
        <div class="action-block">
          <h3 id="actionLabel"></h3>
          <p id="actionBody"></p>
        </div>
        <p class="comprehension-block" id="comprehensionText"></p>
        <button id="closeNextBtn" class="btn btn-primary" type="button"></button>
      </div>
    </div>

    <div id="levelFailedScreen" class="overlay" role="dialog" aria-modal="true" aria-labelledby="levelFailedTitle" hidden>
      <div class="overlay-card">
        <p class="card-kicker" data-i18n="card_kicker"></p>
        <h2 id="levelFailedTitle" data-i18n="level_failed_title"></h2>
        <p data-i18n="level_failed_body"></p>
        <button id="failedRetryBtn" class="btn btn-primary" type="button" data-i18n="level_failed_btn"></button>
      </div>
    </div>
  </div>
  </div>

  <div class="touch-controls" aria-label="Game controls">
    <div class="move-pad" id="movePad">
      <button id="btnLeft" class="ctrl-btn" type="button" aria-label="Move basket left">◀</button>
      <button id="btnRight" class="ctrl-btn" type="button" aria-label="Move basket right">▶</button>
    </div>
    <div class="control-readout">
      <strong id="moveLabel">MOVE THE BASKET</strong>
      <p id="controlHint" aria-live="polite">Use ← and → to move. Catch only bocachico and vizcaína.</p>
    </div>
    <div id="tfPad" class="tf-pad" role="group" hidden>
      <button id="btnFalse" class="tf-btn tf-false" type="button">F</button>
      <button id="btnTrue" class="tf-btn tf-true" type="button">V</button>
    </div>
  </div>

  <p id="srStatus" class="sr-only" role="status" aria-live="polite"></p>
  <noscript>This game needs JavaScript enabled to work. / Este juego necesita JavaScript habilitado para funcionar.</noscript>
</main>

<footer class="app-footer">
  <p data-i18n="footer_text"></p>
</footer>

<script>

  'use strict';

  function applyLanguage(){
    document.documentElement.lang = currentLang;

      el.textContent = t(el.getAttribute('data-i18n'));
    });

  function renderEvidence(){
    if (!activeEvidence) return;
    evidenceTitle.textContent = t(activeEvidence.titleKey);
    evidenceBody.textContent = t(activeEvidence.bodyKey);
    evidenceSource.textContent = t(activeEvidence.sourceKey);
    evidenceSource.setAttribute('aria-label', currentLang === 'en' ? 'Evidence source' : 'Fuente de la evidencia');
    evidenceContinueBtn.textContent = t(activeEvidence.btnKey);
  }
  function showEvidence(keys, btnKey, onContinue){
    activeEvidence = { titleKey:keys.title, bodyKey:keys.body, sourceKey:keys.source, btnKey:btnKey };
    evidenceOnContinue = onContinue;
    renderEvidence();
    evidenceModal.hidden = false;
    evidenceContinueBtn.focus();
  }
  evidenceContinueBtn.addEventListener('click', function(){
    evidenceModal.hidden = true;

  function renderLevelClose(){
    const level = LEVELS[currentLevelIndex];
    closeTitle.textContent = t(level.exitKeys.title);

    const total = level.verification.length;

    const stars = 1 + (correct >= total-1 ? 1 : 0) + (health >= 50 ? 1 : 0);
    comprehensionText.textContent = t('comprehension_label')+': '+correct+' '+t('comprehension_of')+' '+total+' '+t('comprehension_first_try')
      +'\n'+t('seal_label')+': '+'★'.repeat(stars)+'☆'.repeat(3-stars)+' · '+t('hud_score')+': '+score;
  }
  closeNextBtn.addEventListener('click', function(){
    levelCloseScreen.hidden = true;
    score = 0; updateScore();
    health = 100; refreshHealthDisplay();
    enterLevel(0);
  });

  /* ===================== SALUD / FALLO DE NIVEL ===================== */
  function refreshHealthDisplay(){
    healthFill.style.width = health + '%';
    healthPercent.textContent = Math.round(health) + '%';
    healthBar.setAttribute('aria-valuenow', Math.round(health));
    if (health > 60) healthFill.style.background = 'var(--leaf-green)';
    else if (health > 30) healthFill.style.background = 'var(--sun-gold)';
    else healthFill.style.background = 'var(--danger-coral)';
  }
  function updateHealth(delta){
    health = clamp(health + delta, 0, 100);
    refreshHealthDisplay();
    if (health <= 0 && state === 'catching') failLevel();
  }
  function failLevel(){
    state = 'failed';
    objects = [];
    levelFailedScreen.hidden = false;
    announce(t('level_failed_title'));
    failedRetryBtn.focus();
  }
  failedRetryBtn.addEventListener('click', function(){
    levelFailedScreen.hidden = true;
    health = 100;
    refreshHealthDisplay();
    goalProgress = 0;
    objects = [];
    streak = 0; timeLeft = LEVELS[currentLevelIndex].time*1000; alertTimer = 0; nextAlert = 9000;
    state = 'catching';
    spawnTimer = 400;
    canvas.focus();
  });

  /* ===================== FLUJO DE NIVELES ===================== */
  function enterLevel(index){
    currentLevelIndex = index;
    const level = LEVELS[index];
    goalProgress = 0;
    duringShown = false;
    objects = [];
    streak = 0; timeLeft = level.time*1000; alertTimer = 0; nextAlert = 9000;
    comprehension = {};
    level.verification.forEach(function(it){ comprehension[it.id] = null; });
    state = 'entry';
    renderHud();
    showEvidence(level.entryKeys, 'entry_start_btn', function(){
      state = 'catching';
      spawnTimer = 400;
      renderHud();
      canvas.focus();
    });
  }

  function maybeShowDuringOnMistake(){
    if (duringShown) return;
    duringShown = true;
    state = 'duringPause';
    showEvidence(LEVELS[currentLevelIndex].duringKeys, 'during_continue_btn', function(){
      state = 'catching';
    });
  }

  function onGoalReached(){
    state = 'goalPause';
    alertTimer = 0;
    objects = [];
    showToast(t('goal_reached'));
    setTimeout(function(){
      if (!duringShown){
        duringShown = true;
        showEvidence(LEVELS[currentLevelIndex].duringKeys, 'during_continue_btn', startVerification);
      } else {
        startVerification();
      }
    }, 700);
  }

  function showToast(text){
    toastBanner.textContent = text;
    toastBanner.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastBanner.classList.remove('show'); }, 1400);
  }

  /* ===================== RONDA DE ATRAPAR ===================== */
  function pickSpecies(level){
    const weights = level.spawnWeights;
    const total = weights.reduce(function(s,w){ return s+w[1]; }, 0);
    let r = Math.random()*total;
    for (let i=0;i<weights.length;i++){
      if (r < weights[i][1]) return weights[i][0];
      r -= weights[i][1];
    }
    return weights[0][0];
  }
  function spawnCatchObject(){
    const level = LEVELS[currentLevelIndex];
    const id = pickSpecies(level);
    const def = level.species[id];
    const margin = Math.max(def.size,92);
    const x = margin + Math.random()*(canvas.width - margin*2);
    const speed = 115 + Math.random()*60 + goalProgress*5;
    objects.push({ id:id, x:x, y:-def.size, speed:speed, size:def.size, direction:Math.random()<.5?-1:1 });
  }
  function spawnFloatingText(x,y,text,tone){
    floatingTexts.push({ x:x, y:y, text:text, tone:tone, life:1600, maxLife:1600 });
    announce(text);
  }
  function updateFloatingTexts(dt){
    for (let i=floatingTexts.length-1;i>=0;i--){
      floatingTexts[i].life -= dt;
      if (floatingTexts[i].life <= 0) floatingTexts.splice(i,1);
    }
  }

  function updateCatching(dt){
    const dir = (rightPressed?1:0) - (leftPressed?1:0);
    basket.x = clamp(basket.x + dir*basket.speed*(dt/1000), basket.width/2, canvas.width - basket.width/2);

    timeLeft -= dt;
    if (timeLeft <= 0){ timeLeft = 0; failLevel(); return; }
    if (alertTimer > 0){ alertTimer -= dt; }
    else { nextAlert -= dt; if (nextAlert <= 0){ alertTimer = 4500; nextAlert = 9000 + Math.random()*5000; announce(t('mining_alert')); } }
    spawnTimer -= dt;
    if (spawnTimer <= 0){ spawnCatchObject(); spawnTimer = 560 - Math.min(160, goalProgress*14); }

    const level = LEVELS[currentLevelIndex];

    for (let i=objects.length-1; i>=0; i--){
      const obj = objects[i];
      obj.y += obj.speed*(dt/1000);
      const def = level.species[obj.id];

      const caught = Math.abs(obj.x-basket.x) < (basket.width/2+obj.size*0.32)
        && obj.y+obj.size*0.4 > basket.y-basket.height/2
        && obj.y-obj.size*0.4 < basket.y+basket.height/2;

      if (caught){
        objects.splice(i,1);
        if (alertTimer > 0){
          streak = 0; updateHealth(-6);
          if (state !== 'catching') return;
          spawnFloatingText(obj.x, basket.y-52, t('l1_catch_mining'), 'bad');
          maybeShowDuringOnMistake();
          if (state !== 'catching') return;
        } else if (def.risk === 'low'){
          streak++; score += 10*multiplier(); updateScore();
          goalProgress++;
          spawnFloatingText(obj.x, basket.y-52, t('l1_catch_low'), 'good');
          if (goalProgress >= level.goal){ onGoalReached(); return; }
        } else {
          streak = 0; updateHealth(def.risk === 'high' ? -7 : -4);
          if (state !== 'catching') return;
          const feedbackKey = def.risk === 'high' ? 'l1_catch_high' : 'l1_catch_medium';
          spawnFloatingText(obj.x, basket.y-52, t(feedbackKey), 'bad');
          maybeShowDuringOnMistake();
          if (state !== 'catching') return;
        }
        continue;
      }

      if (obj.y-obj.size/2 > canvas.height){
        objects.splice(i,1);
        if (def.risk === 'low' && alertTimer <= 0){
          streak = 0; updateHealth(-1);
          if (state !== 'catching') return;
          spawnFloatingText(obj.x, canvas.height-78, t('l1_miss_low'), 'bad');
        }
      }
    }
    updateFloatingTexts(dt);
  }

  function updateScore(){ scoreValue.textContent = String(score); }

  /* ===================== VERIFICACION ===================== */
  function shuffleArray(arr){
    for (let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
  }
  function startVerification(){
    state = 'verifying';
    const level = LEVELS[currentLevelIndex];
    verifyQueue = level.verification.map(function(it){ return { item:it, isReview:false }; });
    shuffleArray(verifyQueue);
    verifyCurrent = null;
    verifySpawnDelay = 300;
    tfPad.hidden = false;
    renderHud();
    canvas.focus();
  }
  function spawnVerifyPhrase(){
    const entry = verifyQueue.shift();
    if (!entry){ finishVerification(); return; }
    verifyCurrent = { item:entry.item, isReview:entry.isReview, x:canvas.width/2, y:-70, speed:105, w:380 };
  }
  function currentVerifyText(){
    const it = verifyCurrent.item;
    if (verifyCurrent.isReview) return currentLang==='en' ? it.reviewEn : it.reviewEs;
    return currentLang==='en' ? it.mainEn : it.mainEs;
  }
  function currentVerifyAnswer(){
    const it = verifyCurrent.item;
    return verifyCurrent.isReview ? it.reviewAnswer : it.mainAnswer;
  }
  function resolveVerify(userSaysTrue){
    if (!verifyCurrent) return;
    const it = verifyCurrent.item;
    const correct = (userSaysTrue === currentVerifyAnswer());
    if (!verifyCurrent.isReview && comprehension[it.id] === null){
      comprehension[it.id] = correct;
    }
    if (correct){ score += 20; updateScore(); }
    spawnFloatingText(verifyCurrent.x, basket.y-70, correct ? t('verify_correct') : t('verify_incorrect'), correct?'good':'bad');
    if (!correct){ verifyQueue.push({ item:it, isReview:true }); }
    verifyCurrent = null;
    verifySpawnDelay = 350;
  }
  function resolveVerifyTimeout(){
    if (!verifyCurrent) return;
    const it = verifyCurrent.item;
    if (!verifyCurrent.isReview && comprehension[it.id] === null){
      comprehension[it.id] = false;
    }
    spawnFloatingText(canvas.width/2, canvas.height-80, t('verify_incorrect'), 'bad');
    verifyQueue.push({ item:it, isReview:true });
    verifyCurrent = null;
    verifySpawnDelay = 350;
  }
  function finishVerification(){
    tfPad.hidden = true;
    state = 'close';
    renderLevelClose();
    levelCloseScreen.hidden = false;
    closeNextBtn.focus();
  }
  function updateVerifying(dt){
    if (!verifyCurrent){
      verifySpawnDelay -= dt;
      if (verifySpawnDelay <= 0) spawnVerifyPhrase();
      updateFloatingTexts(dt);
      return;
    }
    verifyCurrent.y += verifyCurrent.speed*(dt/1000);
    if (verifyCurrent.y > VERIFY_LIMIT) resolveVerifyTimeout();
    updateFloatingTexts(dt);
  }
  function bindAnswer(btn, value){
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      if (state === 'verifying' && verifyCurrent) resolveVerify(value);
    });
    btn.addEventListener('keydown', function(e){ if (e.key === 'Enter') e.stopPropagation(); });
  }
  bindAnswer(btnTrue, true);
  bindAnswer(btnFalse, false);

  /* ===================== HUD ===================== */
  function renderHud(){
    const verifying = state === 'verifying', catching = state === 'catching';
    const modeText = verifying ? t('hud_verifying') : catching ? t('hud_catching') : t('hud_paused');
    hudLevelLine.textContent = t('level1_name')+' · '+modeText;
    movePad.hidden = verifying; controlReadout.hidden = verifying; tfPad.hidden = !verifying;
    if (verifying){
      hudGoalLabel.textContent = t('verify_hint');
    } else if (catching){
      const level = LEVELS[currentLevelIndex];
      hudGoalLabel.textContent = t('hud_goal')+': '+Math.min(goalProgress, level.goal)+'/'+level.goal+' · ⏱ '+Math.ceil(timeLeft/1000)+'s'+(multiplier() > 1 ? ' · x'+multiplier() : '');
      controlHint.textContent = t('catch_hint');
      moveLabel.textContent = t('move_label');
    } else {
      hudGoalLabel.textContent = '';
      controlHint.textContent = t('general_hint');
      moveLabel.textContent = t('move_label');
    }
  }

  function fitCanvasFrame(){
    if (!stageArea || !canvasWrap) return;
    const rect = stageArea.getBoundingClientRect();
    const availableWidth = Math.max(1, rect.width - 4);
    const availableHeight = Math.max(1, rect.height - 4);
    const scale = Math.min(availableWidth / canvas.width, availableHeight / canvas.height);
    const fittedWidth = Math.max(1, Math.floor(canvas.width * scale));
    const fittedHeight = Math.max(1, Math.floor(canvas.height * scale));
    canvasWrap.style.width = fittedWidth + 'px';
    canvasWrap.style.height = fittedHeight + 'px';
  }

  /* ===================== DIBUJO ===================== */
  function roundRect(x,y,w,h,r){
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function wrapTextLines(text, maxWidth){
    const words = text.split(' ');
    let line = '';
    const lines = [];
    words.forEach(function(w){
      const test = line ? line+' '+w : w;
      if (ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
      else line = test;
    });
    lines.push(line);
    return lines;
  }
  function drawBackground(dt){
    // The background is a cropped, local copy of the student's watercolor river reference.
    if (riverBackground.complete && riverBackground.naturalWidth > 0){
      ctx.drawImage(riverBackground,0,0,canvas.width,canvas.height);
      ctx.fillStyle = 'rgba(24,118,110,.10)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    } else {
      const fallback = ctx.createLinearGradient(0,0,0,canvas.height);
      fallback.addColorStop(0,'#b8e7d6');
      fallback.addColorStop(1,'#5eb4a2');
      ctx.fillStyle = fallback;
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    if (!prefersReducedMotion) waveOffset += dt*0.0014;
    // Fine hand-painted water lines; they move slowly and stay behind the fish.
    ctx.save();
    ctx.lineCap = 'round';
    for (let i=0;i<9;i++){
      const yBase = 42 + i*66;
      ctx.beginPath();
      for (let x=0;x<=canvas.width;x+=18){
        const y = yBase + Math.sin(x*.014 + waveOffset + i*.82)*4 + Math.sin(x*.031+i)*1.3;
        if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = i%2 ? 'rgba(250,255,226,.24)' : 'rgba(24,112,103,.12)';
      ctx.lineWidth = i%2 ? 2 : 1.3;
      ctx.stroke();
    }
    // A few tiny glints create movement without hiding the river artwork.
    for (let i=0;i<18;i++){
      const x = (i*137 + 42) % canvas.width;
      const y = (i*83 + 35 + Math.sin(waveOffset+i)*5) % canvas.height;
      ctx.beginPath();
      ctx.ellipse(x,y,3.2,1.2,-.3,0,Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,235,.48)';
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFishShape(x,y,size,def,direction){
    const w = size*1.48;
    const h = size*.76;
    ctx.save();
    ctx.translate(x,y);
    if (direction < 0) ctx.scale(-1,1);
    ctx.shadowColor = 'rgba(20,65,54,.26)';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetY = 3;

    // Tail and fins first, like layered paper cut-outs.
    ctx.fillStyle = def.color;
    ctx.strokeStyle = 'rgba(48,75,61,.72)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-w*.37,0);
    ctx.quadraticCurveTo(-w*.58,-h*.42,-w*.74,-h*.48);
    ctx.quadraticCurveTo(-w*.69,0,-w*.74,h*.48);
    ctx.quadraticCurveTo(-w*.54,h*.34,-w*.37,0);
    ctx.fill();ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-w*.18,-h*.31);
    ctx.quadraticCurveTo(0,-h*.72,w*.20,-h*.36);
    ctx.quadraticCurveTo(w*.06,-h*.28,-w*.18,-h*.31);
    ctx.fillStyle = def.color;ctx.fill();ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-w*.02,h*.27);
    ctx.quadraticCurveTo(w*.12,h*.62,w*.29,h*.28);
    ctx.quadraticCurveTo(w*.12,h*.34,-w*.02,h*.27);
    ctx.fillStyle = def.light;ctx.fill();ctx.stroke();

    const bodyGradient = ctx.createLinearGradient(0,-h*.5,0,h*.48);
    bodyGradient.addColorStop(0,def.light);
    bodyGradient.addColorStop(.48,def.color);
    bodyGradient.addColorStop(1,shadeColor(def.color,-24));
    ctx.beginPath();
    ctx.moveTo(-w*.43,0);
    ctx.quadraticCurveTo(-w*.29,-h*.49,w*.18,-h*.42);
    ctx.quadraticCurveTo(w*.43,-h*.31,w*.49,-h*.03);
    ctx.quadraticCurveTo(w*.38,h*.34,w*.05,h*.42);
    ctx.quadraticCurveTo(-w*.30,h*.41,-w*.43,0);
    ctx.closePath();
    ctx.fillStyle = bodyGradient;ctx.fill();
    ctx.strokeStyle = 'rgba(43,72,62,.82)';ctx.lineWidth = 1.8;ctx.stroke();
    ctx.shadowColor = 'transparent';ctx.shadowBlur = 0;ctx.shadowOffsetY = 0;

    // Hand-painted markings: small scales, stripes, or spots depending on the species.
    if (def.pattern === 'stripes'){
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-w*.38,0);
      ctx.quadraticCurveTo(-w*.25,-h*.45,w*.18,-h*.4);
      ctx.quadraticCurveTo(w*.43,-h*.28,w*.49,-h*.03);
      ctx.quadraticCurveTo(w*.38,h*.34,w*.05,h*.42);
      ctx.quadraticCurveTo(-w*.30,h*.41,-w*.38,0);
      ctx.clip();
      ctx.strokeStyle = 'rgba(58,57,43,.48)';ctx.lineWidth = Math.max(3,size*.085);
      for (let i=0;i<4;i++){
        const sx=-w*.18+i*w*.17;
        ctx.beginPath();ctx.moveTo(sx,-h*.55);ctx.quadraticCurveTo(sx-w*.11,0,sx+w*.01,h*.55);ctx.stroke();
      }
      ctx.restore();
    } else if (def.pattern === 'spots'){
      ctx.fillStyle='rgba(71,70,52,.3)';
      for(let i=0;i<9;i++){
        const sx=-w*.22+(i%3)*w*.16, sy=-h*.18+Math.floor(i/3)*h*.16;
        ctx.beginPath();ctx.ellipse(sx,sy,2.1,1.35,.2,0,Math.PI*2);ctx.fill();
      }
    } else {
      ctx.strokeStyle='rgba(255,247,211,.42)';ctx.lineWidth=1;
      for(let row=0;row<2;row++) for(let col=0;col<5;col++){
        const sx=-w*.23+col*w*.115+(row%2)*4, sy=-h*.13+row*h*.2;
        ctx.beginPath();ctx.arc(sx,sy,2.4,.15,Math.PI-.15);ctx.stroke();
      }
    }

    // Gill, eye, and mouth give the fish a recognizable, illustrated face.
    ctx.strokeStyle='rgba(52,72,62,.72)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(w*.16,0,h*.24,-.95,.95);ctx.stroke();
    ctx.fillStyle='#183c39';ctx.beginPath();ctx.arc(w*.34,-h*.14,2.7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(w*.35,-h*.16,.9,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(w*.43,h*.03);ctx.quadraticCurveTo(w*.49,h*.07,w*.53,h*.03);ctx.stroke();

    if (def.pattern === 'stripes' && (def.labelEs === 'Bagre rayado' || def.labelEs === 'Moncholo')){
      ctx.strokeStyle='rgba(54,66,55,.72)';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(w*.42,h*.08);ctx.quadraticCurveTo(w*.57,h*.2,w*.61,h*.13);ctx.moveTo(w*.41,h*.12);ctx.quadraticCurveTo(w*.55,h*.31,w*.6,h*.25);ctx.stroke();
    }
    ctx.restore();
  }

  function shadeColor(hex, amount){
    const n=parseInt(hex.slice(1),16);
    const r=Math.max(0,Math.min(255,(n>>16)+amount));
    const g=Math.max(0,Math.min(255,((n>>8)&255)+amount));
    const b=Math.max(0,Math.min(255,(n&255)+amount));
    return '#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1);
  }

  function drawCatchObject(obj){
    const level = LEVELS[currentLevelIndex];
    const def = level.species[obj.id];
    const bob = Math.sin((obj.y+obj.x)*.018)*1.8;
    drawFishShape(obj.x,obj.y+bob,obj.size,def,obj.direction || 1);

    const label = currentLang==='en' ? def.labelEn : def.labelEs;
    ctx.save();
    ctx.font = '800 11px "Trebuchet MS","Segoe UI",sans-serif';
    const labelWidth = Math.min(112,Math.max(54,ctx.measureText(label).width+14));
    const labelY = obj.y + obj.size*.67;
    ctx.beginPath();
    roundRect(obj.x-labelWidth/2,labelY-11,labelWidth,18,7);
    ctx.fillStyle='rgba(250,244,222,.94)';ctx.fill();
    ctx.lineWidth=1;ctx.strokeStyle='rgba(62,91,69,.55)';ctx.stroke();
    ctx.fillStyle='#284b42';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,obj.x,labelY-1, labelWidth-8);
    ctx.restore();
  }

  function drawBasket(){
    const x=basket.x, y=basket.y;
    ctx.save();
    // Water shadow and gentle ripples.
    ctx.beginPath();ctx.ellipse(x,y+19, basket.width*.62,10,0,0,Math.PI*2);
    ctx.fillStyle='rgba(14,75,69,.24)';ctx.fill();
    ctx.strokeStyle='rgba(250,255,230,.62)';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(x,y+18,basket.width*.69,13,0,Math.PI*.08,Math.PI*.92);ctx.stroke();

    const bw=basket.width, bh=basket.height;
    ctx.beginPath();
    ctx.moveTo(x-bw*.52,y-12);
    ctx.quadraticCurveTo(x-bw*.43,y+bh*.46,x-bw*.29,y+bh*.5);
    ctx.quadraticCurveTo(x,y+bh*.66,x+bw*.29,y+bh*.5);
    ctx.quadraticCurveTo(x+bw*.43,y+bh*.46,x+bw*.52,y-12);
    ctx.closePath();
    const basketGrad=ctx.createLinearGradient(x,y-12,x,y+bh*.6);
    basketGrad.addColorStop(0,'#d8ad68');basketGrad.addColorStop(.55,'#b87b3e');basketGrad.addColorStop(1,'#87552f');
    ctx.fillStyle=basketGrad;ctx.fill();ctx.strokeStyle='#704526';ctx.lineWidth=2.3;ctx.stroke();
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x-bw*.5,y-12);ctx.quadraticCurveTo(x-bw*.4,y+bh*.45,x-bw*.28,y+bh*.48);
    ctx.quadraticCurveTo(x,y+bh*.62,x+bw*.28,y+bh*.48);ctx.quadraticCurveTo(x+bw*.4,y+bh*.45,x+bw*.5,y-12);ctx.closePath();ctx.clip();
    ctx.strokeStyle='rgba(93,54,29,.6)';ctx.lineWidth=2;
    for(let yy=y-2;yy<y+bh*.52;yy+=8){
      ctx.beginPath();ctx.moveTo(x-bw*.53,yy);ctx.quadraticCurveTo(x,yy+5,x+bw*.53,yy);ctx.stroke();
    }
    for(let xx=x-bw*.42;xx<=x+bw*.42;xx+=10){
      ctx.beginPath();ctx.moveTo(xx,y-13);ctx.quadraticCurveTo(xx-8,y+bh*.24,xx,y+bh*.53);ctx.stroke();
    }
    ctx.restore();
    // Wide hand-woven rim.
    ctx.beginPath();ctx.ellipse(x,y-12,bw*.54,12,0,0,Math.PI*2);
    ctx.fillStyle='#d9ad67';ctx.fill();ctx.strokeStyle='#704526';ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.ellipse(x,y-12,bw*.43,7,0,0,Math.PI*2);
    ctx.fillStyle='rgba(86,58,35,.3)';ctx.fill();ctx.strokeStyle='rgba(255,225,164,.74)';ctx.lineWidth=1.4;ctx.stroke();
    ctx.restore();
  }

  function drawMiningAlert(){
    if (alertTimer <= 0 || state !== 'catching') return;
    ctx.save();
    ctx.fillStyle = 'rgba(150,84,28,'+(0.22+0.08*Math.sin(Date.now()/160))+')';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.beginPath(); roundRect(canvas.width/2-190,14,380,40,12);
    ctx.fillStyle = 'rgba(120,50,20,.93)'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 18px "Trebuchet MS","Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚠ '+t('mining_alert'), canvas.width/2, 34);
    ctx.fillStyle = '#ffd27a'; ctx.fillRect(canvas.width/2-170,48,340*(alertTimer/4500),3);
    ctx.restore();
  }
  function drawVerifyPhrase(){
    if (!verifyCurrent) return;
    const vc = verifyCurrent;
    const text = currentVerifyText();
    ctx.save();
    ctx.font = '700 17px "Trebuchet MS","Segoe UI",sans-serif';
    const lines = wrapTextLines(text, vc.w-34);
    const lineHeight = 24;
    const boxH = lines.length*lineHeight + 38;

    ctx.beginPath();
    roundRect(vc.x-vc.w/2, vc.y-boxH/2, vc.w, boxH, 14);
    ctx.fillStyle = 'rgba(251,241,217,0.97)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(11,95,122,0.55)';
    ctx.stroke();

    ctx.fillStyle = '#16241f';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    const startY = vc.y - boxH/2 + 27;
    lines.forEach(function(line,i){ ctx.fillText(line, vc.x, startY+i*lineHeight); });

    const frac = clamp(1-(vc.y+70)/(VERIFY_LIMIT+70), 0, 1);
    ctx.fillStyle = 'rgba(36,61,55,.18)'; ctx.fillRect(vc.x-vc.w/2+14, vc.y+boxH/2-13, vc.w-28, 5);
    ctx.fillStyle = frac < .3 ? '#c84f3b' : '#47845c'; ctx.fillRect(vc.x-vc.w/2+14, vc.y+boxH/2-13, (vc.w-28)*frac, 5);
    if (vc.isReview){
      const badgeW = 86, badgeH = 19;
      const bx = vc.x - vc.w/2 + 6;
      const by = vc.y - boxH/2 - badgeH - 4;
      ctx.beginPath();
      roundRect(bx, by, badgeW, badgeH, 9);
      ctx.fillStyle = '#e4572e';
      ctx.fill();
      ctx.font = '900 10px "Trebuchet MS","Segoe UI",sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(t('review_badge'), bx+badgeW/2, by+13);
    }
    ctx.restore();
  }
  function drawFloatingTexts(){
    floatingTexts.forEach(function(ft){
      const p = ft.life/ft.maxLife;
      ctx.save();
      ctx.globalAlpha = Math.min(1, p*1.4);
      ctx.fillStyle = ft.tone==='good' ? '#bdf5d1' : '#ffd0c2';
      ctx.font = 'bold 16px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      const lines = wrapTextLines(ft.text, 220);
      const startY = ft.y - (1-p)*46;
      lines.forEach(function(line,i){ ctx.fillText(line, ft.x, startY+i*18); });
      ctx.restore();
    });
  }
  /* ===================== BUCLE PRINCIPAL ===================== */
  function update(dt){
    if (state === 'catching') updateCatching(dt);
    else if (state === 'verifying') updateVerifying(dt);
    else updateFloatingTexts(dt);
  }
  function render(dt){
    renderHud();
    drawBackground(dt);
    drawMiningAlert();
    objects.forEach(drawCatchObject);
    if (state === 'verifying'){
      ctx.save(); ctx.strokeStyle = 'rgba(200,79,59,.8)'; ctx.setLineDash([10,8]); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0,VERIFY_LIMIT); ctx.lineTo(canvas.width,VERIFY_LIMIT); ctx.stroke(); ctx.restore();
      drawVerifyPhrase();
    } else drawBasket();
    drawFloatingTexts();
  }
  function loop(ts){
    if (lastTime === null) lastTime = ts;
    const dt = Math.min(48, ts-lastTime);
    lastTime = ts;
    update(dt);
    render(dt);
    requestAnimationFrame(loop);
  }

  /* ===================== CONTROLES ===================== */
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft'){ leftPressed = true; e.preventDefault(); }
    if (e.key === 'ArrowRight'){ rightPressed = true; e.preventDefault(); }
    if (state === 'verifying'){
      const k = e.key.toLowerCase();
      if (k === 'f' || k === 'arrowleft'){ e.preventDefault(); if (verifyCurrent) resolveVerify(false); }
      else if (k === 'v' || k === 't' || k === 'arrowright'){ e.preventDefault(); if (verifyCurrent) resolveVerify(true); }
    }
  });
  window.addEventListener('keyup', function(e){
    if (e.key === 'ArrowLeft') leftPressed = false;
    if (e.key === 'ArrowRight') rightPressed = false;
  });
  window.addEventListener('blur', function(){ leftPressed=false; rightPressed=false; });

  function bindHold(el, onPress, onRelease){
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();onPress();
      try{el.setPointerCapture(e.pointerId);}catch(err){}
    });
    el.addEventListener('pointerup', onRelease);
    el.addEventListener('pointercancel', onRelease);
    el.addEventListener('lostpointercapture', onRelease);
  }
  bindHold(btnLeft, function(){leftPressed=true;}, function(){leftPressed=false;});
  bindHold(btnRight, function(){rightPressed=true;}, function(){rightPressed=false;});

  let canvasPointerId = null;
  function setDirectionFromPointer(e){
    const rect=canvas.getBoundingClientRect();
    const logicalX=(e.clientX-rect.left)*(canvas.width/rect.width);
    if(logicalX<canvas.width/2){leftPressed=true;rightPressed=false;}
    else{rightPressed=true;leftPressed=false;}
  }
  canvas.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(state!=='catching') return;
    canvasPointerId=e.pointerId;
    setDirectionFromPointer(e);
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove',function(e){
    if(canvasPointerId!==e.pointerId) return;
    setDirectionFromPointer(e);
    e.preventDefault();
  });
  function releaseCanvasPointer(e){
    if(canvasPointerId===e.pointerId){canvasPointerId=null;leftPressed=false;rightPressed=false;}
  }
  canvas.addEventListener('pointerup',releaseCanvasPointer);
  canvas.addEventListener('pointercancel',releaseCanvasPointer);
  canvas.addEventListener('lostpointercapture',releaseCanvasPointer);

  /* ===================== ARRANQUE ===================== */
  startBtn.addEventListener('click', function(){
    startScreen.hidden = true;
    enterLevel(0);
  });

  applyLanguage();
  refreshHealthDisplay();
  updateScore();
  fitCanvasFrame();
  window.addEventListener('resize',fitCanvasFrame);
  if (window.ResizeObserver){ new ResizeObserver(fitCanvasFrame).observe(stageArea); }
  requestAnimationFrame(function(){fitCanvasFrame();});
  requestAnimationFrame(loop);
  startBtn.focus();

})();
</script>
</body>
</html>
